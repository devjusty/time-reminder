  <body>
    <div class="container">
      <div class="app">
        <header>
          <h1 class="name">TimeReminder</h1>
          <img
            src="./src/time-reminder-icon.png"
            alt="TimeReminder icon"
            width="64"
            height="64"
          />
        </header>
        <p class="about">
          An alternative to typical alarms and timers. Get reminders at the top
          of the hour, bottom of the hour, or the sides.
        </p>
        <span id="digital-clock"></span>
        <div class="clock-container">
          <div class="clock">
            <div class="notch zero active"></div>
            <div class="notch fifteen"></div>
            <div class="notch thirty"></div>
            <div class="notch fortyfive"></div>
            <div class="needle hour"></div>
            <div class="needle minute"></div>
            <div class="needle second"></div>
            <div class="center-point"></div>
          </div>
        </div>
        <span class="error-message"></span>
        <label>Remind at:</label>
        <div class="time-toggles">
          <button class="time-button active" id="alarm1" data-remindtime="00">
            :00
          </button>
          <button class="time-button" id="alarm2" data-remindtime="15">
            :15
          </button>
          <button class="time-button" id="alarm3" data-remindtime="30">
            :30
          </button>
          <button class="time-button" id="alarm4" data-remindtime="45">
            :45
          </button>
        </div>
        <div class="remind-until-container">
          <label for="remind-until">Remind Until: </label>
          <input type="time" id="remind-until" value="17:00" />
          <label for="remind-until-toggle" class="switch">
            <input type="checkbox" id="remind-until-toggle" />
            <span class="slider"></span>
          </label>
        </div>
        <div class="volume-container">
          <label for="volume">Volume: </label>
          <input
            type="range"
            id="volume"
            min="0"
            max="100"
            value="50"
            step="1"
          />
        </div>
      </div>
    </div>
